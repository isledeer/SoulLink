name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------- Web 内核 ----------
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install dependencies
      run: pnpm install

    - name: Build web assets (dist/)
      run: pnpm run build

    # ---------- 原生外壳 ----------
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Android SDK components
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

    - name: Build native APK
      working-directory: ./native
      # 注意用 sh：仓库里 gradlew 的 exec 位在 Android 存储上不生效，可能被提交成 644
      run: sh gradlew assembleDebug --no-daemon --stacktrace

    # 防呆：syncDist 会删掉占位页再拷 dist。这里再验一次，
    # 确保 APK 里装的是真内核而不是「内核未同步」的 1878 字节占位页。
    - name: Verify web core packed
      run: |
        ls -la native/app/src/main/assets/ | head -20
        test -f native/app/src/main/assets/index.html
        test -d native/app/src/main/assets/assets

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SoulLink-Native-APK
        path: native/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: build-${{ github.run_number }}
        files: native/app/build/outputs/apk/debug/app-debug.apk
